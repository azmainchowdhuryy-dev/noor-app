name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: প্রজেক্ট ডিরেক্টরি নির্ধারণ ও ফোল্ডার কাঠামো যাচাই
        id: proj
        run: |
          if [ -f "pubspec.yaml" ]; then
            DIR="."
          elif [ -f "noor_app/pubspec.yaml" ]; then
            DIR="noor_app"
          else
            echo "ERROR: pubspec.yaml পাওয়া যায়নি!"
            exit 1
          fi

          # ব্রাউজার আপলোডের সময় .dart ফাইল রুটে থাকলে lib/ এ গুছিয়ে আনা
          if [ ! -d "$DIR/lib" ] && [ -f "$DIR/main.dart" ]; then
            mkdir -p "$DIR/lib"
            mv "$DIR"/*.dart "$DIR/lib/" 2>/dev/null || true
          fi

          # যদি lib/ এর ভেতরে সাব-ফোল্ডার (models, screens, services, widgets, localization, theme, data) না থাকে,
          # তবে ফ্ল্যাট হয়ে থাকা ফাইলগুলো স্বয়ংক্রিয়ভাবে সঠিক সাব-ফোল্ডারে সরিয়ে নেওয়া
          if [ -d "$DIR/lib" ] && [ ! -d "$DIR/lib/models" ]; then
            mkdir -p "$DIR/lib/data" "$DIR/lib/localization" "$DIR/lib/models" "$DIR/lib/screens" "$DIR/lib/services" "$DIR/lib/theme" "$DIR/lib/widgets"
            for f in hadith_repository.dart quick_actions.dart; do
              [ -f "$DIR/lib/$f" ] && mv "$DIR/lib/$f" "$DIR/lib/data/"
            done
            for f in app_strings.dart date_names.dart digits.dart; do
              [ -f "$DIR/lib/$f" ] && mv "$DIR/lib/$f" "$DIR/lib/localization/"
            done
            for f in allah_name.dart app_location.dart dua.dart hadith.dart prayer.dart quick_action.dart surah.dart; do
              [ -f "$DIR/lib/$f" ] && mv "$DIR/lib/$f" "$DIR/lib/models/"
            done
            for f in hadis_dua_screen.dart home_screen.dart main_shell.dart more_screen.dart tasbih_screen.dart; do
              [ -f "$DIR/lib/$f" ] && mv "$DIR/lib/$f" "$DIR/lib/screens/"
            done
            for f in bookmark_service.dart date_service.dart location_service.dart prayer_service.dart settings_service.dart; do
              [ -f "$DIR/lib/$f" ] && mv "$DIR/lib/$f" "$DIR/lib/services/"
            done
            for f in app_colors.dart app_theme.dart; do
              [ -f "$DIR/lib/$f" ] && mv "$DIR/lib/$f" "$DIR/lib/theme/"
            done
            for f in date_card.dart hadith_card.dart location_header.dart placeholder_body.dart prayer_card.dart quick_action_grid.dart section_title.dart; do
              [ -f "$DIR/lib/$f" ] && mv "$DIR/lib/$f" "$DIR/lib/widgets/"
            done
          fi

          # assets/*.json রুটে থাকলে assets/data/ তে গুছিয়ে আনা
          if [ ! -f "$DIR/assets/data/hadiths.json" ] && [ -f "$DIR/hadiths.json" ]; then
            mkdir -p "$DIR/assets/data"
            mv "$DIR"/*.json "$DIR/assets/data/" 2>/dev/null || true
          fi

          if [ ! -d "$DIR/lib" ]; then
            echo "ERROR: '$DIR/lib' ফোল্ডার পাওয়া যায়নি!"
            exit 1
          fi

          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Android প্রজেক্ট ফাইল তৈরি (প্রথমবার)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          if [ ! -d android ]; then
            cp -r lib /tmp/lib_bak
            cp pubspec.yaml /tmp/pubspec_bak
            flutter create --platforms=android --project-name noor_app --org com.azmain.noor .
            rm -rf lib test
            cp -r /tmp/lib_bak lib
            cp /tmp/pubspec_bak pubspec.yaml
          fi

      - name: AndroidManifest পারমিশন যোগ (Location ও Internet)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          M=android/app/src/main/AndroidManifest.xml
          if [ -f "$M" ] && ! grep -q ACCESS_COARSE_LOCATION "$M"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <application#' "$M"
          fi

      - name: প্যাকেজ ইনস্টল
        working-directory: ${{ steps.proj.outputs.dir }}
        run: flutter pub get

      - name: কোড যাচাই
        working-directory: ${{ steps.proj.outputs.dir }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Release APK বিল্ড
        working-directory: ${{ steps.proj.outputs.dir }}
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: noor-apk
          path: ${{ steps.proj.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
